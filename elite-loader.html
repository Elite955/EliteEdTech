<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELITE – Loading</title>
<style>
  :root { --brand:#06564f; --brand-soft:#0d8174; --bg:#f6efe3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); }

  #elite-loader {
    position:fixed; inset:0; z-index:99999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(22px,4vw,40px); padding:0 6vw;
    background:var(--bg);
  }

  .logo { width:clamp(280px,62vw,760px); height:auto; overflow:visible; fill:var(--brand);
           animation:float 3.2s ease-in-out infinite; }

  /* icon is revealed with a left-to-right wipe */
  .icon-wipe { transform-box:fill-box; transform-origin:left center; transform:scaleX(0);
                animation:wipe 1.3s .15s cubic-bezier(.65,.05,.25,1) forwards; }
  .icon { opacity:0; transform-box:fill-box; transform-origin:center;
           animation:iconin .9s .1s ease-out forwards; }

  /* letters rise in one by one */
  .letter { opacity:0; transform-box:fill-box; transform-origin:center bottom;
             transform:translateY(22px) scale(.92);
             animation:letter .6s cubic-bezier(.2,.9,.3,1.25) forwards; }

  .progress { width:clamp(170px,32vw,320px); height:5px; border-radius:99px;
               background:rgba(6,86,79,.13); overflow:hidden; opacity:0;
               animation:fadein .5s 1.1s forwards; }
  .bar { height:100%; width:0%; border-radius:inherit;
          background:linear-gradient(90deg,var(--brand),var(--brand-soft)); }
  .status { font:700 16px/1 system-ui,"Segoe UI",Arial,sans-serif; letter-spacing:.25em;
             color:var(--brand); opacity:0; animation:fadein .5s 1.2s forwards; }

  @keyframes wipe   { to { transform:scaleX(1); } }
  @keyframes iconin { to { opacity:1; } }
  @keyframes letter { to { opacity:1; transform:none; } }
  @keyframes fadein { to { opacity:1; } }
  @keyframes float  { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }

  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>

<script>
(function () {
  var bar = document.getElementById('elite-bar');
  var pct = document.getElementById('elite-pct');
  var DURATION = 3500;                 // time to reach 100% (ms) – change as needed
  var start = null;
  function ease(t) { return 1 - Math.pow(1 - t, 2.2); }
  function step(ts) {
    if (!start) start = ts;
    var t = Math.min((ts - start) / DURATION, 1);
    var v = Math.round(ease(t) * 100);
    bar.style.width = v + '%';
    pct.textContent = v;
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
