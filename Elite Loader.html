  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  .stage {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 36px;
  }
  .logo {
    position: relative;
    width: min(100%, 760px);
    aspect-ratio: 1400 / 583;
    background: var(--logo) center / 100% 100% no-repeat;
    clip-path: inset(0 0 0 0);
  }
  .sheen {
    position: absolute; inset: 0;
    -webkit-mask: var(--logo) center / 100% 100% no-repeat;
            mask: var(--logo) center / 100% 100% no-repeat;
    background: linear-gradient(105deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%) 130% 0 / 260% 100% no-repeat;
    opacity: 0;
  }
  .run .logo { animation: wipe 1.5s cubic-bezier(.3,.6,.2,1) both; }
  .run .sheen { opacity: 1; animation: shine 2.8s ease-in-out 1.6s infinite; }
  @keyframes wipe {
    from { clip-path: inset(0 100% 0 0); filter: brightness(1.25); }
    to   { clip-path: inset(0 0 0 0);    filter: none; }
  }
  @keyframes shine {
    0%   { background-position: 130% 0; }
    60%, 100% { background-position: -30% 0; }
  }

  .meter { width: min(320px, 78vw); display: grid; gap: 14px; }
  .track { height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; }
  .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold-c), var(--gold-a), var(--gold-b)); }
  .status {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
  }
  .status output { font-variant-numeric: tabular-nums; color: var(--fg); letter-spacing: .06em; }
  .replay {
    font: inherit; font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); background: none; border: 1px solid var(--track); border-radius: 999px;
    padding: 8px 16px; cursor: pointer; transition: color .2s, border-color .2s;
  }
  .replay:hover { color: var(--fg); border-color: var(--gold-b); }
  .replay:focus-visible { outline: 2px solid var(--gold-b); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .run .logo { animation: none; }
    .run .sheen { animation: none; opacity: 0; }
  }
</style>

<main class="stage">
  <div class="logo" id="logo" role="img" aria-label="Elite"><div class="sheen"></div></div>
  <div class="meter">
    <div class="track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <div class="fill" id="fill"></div>
    </div>
    <div class="status"><span id="label">Loading</span><output id="pct">0%</output></div>
  </div>
  <button class="replay" id="replay" type="button" hidden>Replay</button>
</main>

<script>
(function () {
  var stage = document.querySelector('.stage');
  var fill = document.getElementById('fill');
  var pct = document.getElementById('pct');
  var label = document.getElementById('label');
  var bar = document.getElementById('bar');
  var replay = document.getElementById('replay');
  var DURATION = 3600, raf = 0;

  function ease(t) { return 1 - Math.pow(1 - t, 2.4); }
  function setProgress(p) {
    var v = Math.round(p * 100);
    fill.style.width = v + '%';
    pct.textContent = v + '%';
    bar.setAttribute('aria-valuenow', String(v));
  }
  function start() {
    cancelAnimationFrame(raf);
    replay.hidden = true;
    label.textContent = 'Loading';
    setProgress(0);
    stage.classList.remove('run');
    void stage.getBoundingClientRect();
    stage.classList.add('run');
    var t0 = performance.now();
    function frame(now) {
      var t = Math.min((now - t0) / DURATION, 1);
      setProgress(ease(t));
      if (t < 1) { raf = requestAnimationFrame(frame); }
      else { label.textContent = 'Ready'; replay.hidden = false; }
    }
    raf = requestAnimationFrame(frame);
  }
  replay.addEventListener('click', start);
  start();
})();
</script>

</body></html>
